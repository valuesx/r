<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音声書き起こし(帯)</title>
<style>
  :root { --c: #64748b; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #f2f5f7; color: #1b2631; }
  body {
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    font-size: 15px; line-height: 1.35;
  }
  body[data-state="listening"] { --c: #0f766e; }
  body[data-state="waiting"], body[data-state="starting"] { --c: #b45309; }
  body[data-state="error"] { --c: #b91c1c; }

  #bar {
    display: flex; align-items: center; gap: 12px;
    height: 100%; padding: 0 12px; border-top: 3px solid var(--c);
  }
  #state { display: flex; align-items: center; gap: 8px; flex: none; min-width: 7.5em; font-weight: 700; color: var(--c); }
  #dot { width: 14px; height: 14px; border-radius: 50%; background: var(--c); }
  body[data-state="listening"] #dot { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { #dot { animation: none !important; } }

  #text {
    flex: 1; min-width: 0; overflow: hidden;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    word-break: break-all;
  }
  #interim { color: #6b7a89; }
  #btn {
    flex: none; min-height: 44px; padding: 0 18px; font: inherit; font-weight: 700;
    border-radius: 10px; border: 0; background: var(--c); color: #fff;
  }
  #btn[hidden] { display: none; }
  #btn:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
</style>
</head>
<body data-state="starting">
<div id="bar">
  <div id="state"><span id="dot"></span><span id="label">起動中</span></div>
  <div id="text"><span id="final"></span> <span id="interim"></span></div>
  <button id="btn" type="button">開始</button>
</div>

<script>
(function () {
  'use strict';
  var LANG = 'ja-JP';
  var BACKOFF_MIN = 300, BACKOFF_MAX = 10000, HEALTHY_MS = 5000;

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null, want = false, fatal = false, timer = null;
  var backoff = BACKOFF_MIN, gen = 0, startedAt = 0, gotResult = false;

  var label = document.getElementById('label');
  var elFinal = document.getElementById('final');
  var elInterim = document.getElementById('interim');
  var btn = document.getElementById('btn');

  function setState(state, text, showBtn) {
    document.body.setAttribute('data-state', state);
    label.textContent = text;
    btn.hidden = !showBtn;
    try { window.parent.postMessage({ type: 'stt-state', state: state }, '*'); } catch (e) {}
  }

  function create(g) {
    var r = new SR();
    r.lang = LANG;
    r.continuous = true;
    r.interimResults = true;
    r.maxAlternatives = 1;

    r.onstart = function () {
      if (g !== gen) return;
      startedAt = Date.now();
      gotResult = false;
      setState('listening', '聞き取り中', false);
    };
    r.onresult = function (e) {
      if (g !== gen) return;
      var interim = '';
      for (var i = e.resultIndex; i < e.results.length; i++) {
        var res = e.results[i];
        var t = (res[0] && res[0].transcript ? res[0].transcript : '').trim();
        if (!t) continue;
        if (res.isFinal) {
          gotResult = true;
          elFinal.textContent = t;
          elInterim.textContent = '';
        } else {
          interim += t;
        }
      }
      if (interim) elInterim.textContent = interim;
    };
    r.onerror = function (e) {
      if (g !== gen) return;
      var code = e.error || 'unknown';
      if (code === 'not-allowed' || code === 'service-not-allowed' || code === 'language-not-supported') {
        fatal = true; want = false;
        setState('error', 'マイク不可', true);
        elFinal.textContent = 'エラー: ' + code;
        elInterim.textContent = '';
      }
    };
    r.onend = function () {
      if (g !== gen) return;
      var d = startedAt ? Date.now() - startedAt : 0;
      startedAt = 0;
      elInterim.textContent = '';
      if (fatal) return;
      if (!want) { setState('idle', '停止中', true); return; }
      if (gotResult || d >= HEALTHY_MS) backoff = BACKOFF_MIN;
      else backoff = Math.min(backoff * 2, BACKOFF_MAX);
      setState('waiting', '再開中', false);
      timer = setTimeout(launch, backoff);
    };
    return r;
  }

  function launch() {
    timer = null;
    if (!want) return;
    gen++;
    var g = gen;
    try {
      rec = create(g);
      rec.start();
    } catch (e) {
      backoff = Math.min(backoff * 2, BACKOFF_MAX);
      setState('waiting', '再開中', true);
      timer = setTimeout(launch, backoff);
    }
  }

  function start() {
    if (!SR) {
      setState('error', '非対応', false);
      elFinal.textContent = 'このブラウザは音声認識に対応していません';
      return;
    }
    if (timer) { clearTimeout(timer); timer = null; }
    if (rec) { try { rec.abort(); } catch (e) {} }
    want = true; fatal = false; backoff = BACKOFF_MIN;
    elFinal.textContent = '';
    setState('starting', '起動中', true);
    launch();
  }

  btn.addEventListener('click', start);
  start();   // 読み込み時に自動で開始を試みる(許可済みなら、そのまま動く)
})();
</script>
</body>
</html>
