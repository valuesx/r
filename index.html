<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>音声書き起こし 動作確認</title>
<style>
  :root {
    --bg: #f2f5f7;
    --panel: #ffffff;
    --ink: #1b2631;
    --sub: #5b6b7a;
    --line: #d5dde4;
    --ok: #0f766e;
    --wait: #b45309;
    --err: #b91c1c;
    --off: #64748b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    font-size: 16px;
    line-height: 1.55;
  }
  main { max-width: 860px; margin: 0 auto; padding: 14px 14px 40px; }

  .status {
    display: flex; align-items: center; gap: 16px;
    padding: 18px 20px; border-radius: 14px;
    background: var(--panel); border: 2px solid var(--off);
  }
  .status .dot { width: 22px; height: 22px; border-radius: 50%; background: var(--off); flex: none; }
  .status #stateText { font-size: 26px; font-weight: 700; line-height: 1.2; }
  .status #stateSub { color: var(--sub); font-size: 14px; margin-top: 2px; }
  .status[data-state="listening"] { border-color: var(--ok); }
  .status[data-state="listening"] .dot { background: var(--ok); animation: pulse 1.6s ease-in-out infinite; }
  .status[data-state="listening"] #stateText { color: var(--ok); }
  .status[data-state="waiting"] { border-color: var(--wait); }
  .status[data-state="waiting"] .dot { background: var(--wait); }
  .status[data-state="waiting"] #stateText { color: var(--wait); }
  .status[data-state="error"] { border-color: var(--err); }
  .status[data-state="error"] .dot { background: var(--err); }
  .status[data-state="error"] #stateText { color: var(--err); }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.78); opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { .status .dot { animation: none !important; } }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0 6px; align-items: center; }
  button {
    font: inherit; font-weight: 600; min-height: 48px; padding: 0 20px;
    border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  button.primary { background: var(--ok); border-color: var(--ok); color: #fff; }
  button.danger { background: var(--err); border-color: var(--err); color: #fff; }
  button:focus-visible, input:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
  label.opt { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 6px; }
  label.opt input { width: 22px; height: 22px; }

  #interim {
    min-height: 2.2em; margin: 6px 0 14px; padding: 8px 12px;
    border-left: 4px solid var(--line); color: var(--sub); font-size: 15px;
  }

  section.panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; margin-top: 14px;
  }
  section.panel h2 { margin: 0 0 10px; font-size: 17px; }
  dl { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0; }
  dt { color: var(--sub); }
  dd { margin: 0; word-break: break-all; }
  .warn { color: var(--err); font-weight: 600; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .metric { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  .metric .k { color: var(--sub); font-size: 13px; }
  .metric .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .metric .v.small { font-size: 15px; font-weight: 600; }

  ul.list { list-style: none; margin: 0; padding: 0; max-height: 300px; overflow-y: auto; }
  ul.list li { padding: 8px 2px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 72px 1fr; gap: 10px; }
  ul.list li:last-child { border-bottom: 0; }
  ul.list .t { color: var(--sub); font-variant-numeric: tabular-nums; font-size: 14px; }
  .tag { display: inline-block; margin-left: 8px; padding: 0 8px; border-radius: 6px; background: #fee2e2; color: var(--err); font-size: 13px; font-weight: 600; }
  .empty { color: var(--sub); padding: 6px 2px; }

  ul.log li { grid-template-columns: 72px 90px 1fr; font-size: 14px; padding: 4px 2px; }
  ul.log li.k-err { color: var(--err); }
  ul.log li.k-state { color: var(--ok); font-weight: 600; }
  ul.log li.k-ev { color: var(--sub); }
</style>
</head>
<body>
<main>

  <header class="status" id="statusBox" data-state="idle">
    <span class="dot"></span>
    <div>
      <div id="stateText">停止中</div>
      <div id="stateSub">「開始」を押すと、マイクの使用許可を求められます</div>
    </div>
  </header>

  <div class="controls">
    <button id="btnStart" class="primary" type="button">開始</button>
    <button id="btnStop" class="danger" type="button" disabled>停止</button>
    <label class="opt"><input type="checkbox" id="optAuto" checked>自動で再開する</label>
    <label class="opt"><input type="checkbox" id="optInterim">途中結果を表示</label>
    <label class="opt"><input type="checkbox" id="optVerbose">詳細イベントも記録</label>
  </div>
  <div class="controls">
    <button id="btnCopy" type="button">結果をコピー</button>
    <button id="btnClear" type="button">記録を消去</button>
    <span id="copyMsg" class="empty"></span>
  </div>

  <div id="interim" aria-live="polite"></div>

  <section class="panel">
    <h2>実行環境</h2>
    <dl id="env"></dl>
  </section>

  <section class="panel">
    <h2>計測</h2>
    <div class="grid" id="metrics"></div>
  </section>

  <section class="panel">
    <h2>確定した発話</h2>
    <ul class="list" id="finals"><li class="empty" style="display:block">まだありません</li></ul>
  </section>

  <section class="panel">
    <h2>イベント記録(新しい順)</h2>
    <ul class="list log" id="log"></ul>
  </section>

</main>

<script>
(function () {
  'use strict';

  // ---------- 設定 ----------
  var LANG = 'ja-JP';
  var BACKOFF_MIN = 300;      // 再開までの最短待ち(ms)
  var BACKOFF_MAX = 10000;    // 再開までの最長待ち(ms)
  var HEALTHY_MS = 5000;      // これ以上続いたセッションは「正常」とみなす
  var DUP_WINDOW_MS = 8000;   // 同一文言がこの間隔内に再度確定したら重複疑い
  var LOG_MAX = 400;

  // ---------- 状態 ----------
  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null;
  var wantRun = false;
  var fatal = false;
  var restartTimer = null;
  var backoff = BACKOFF_MIN;
  var sessionNo = 0;
  var curStart = 0;
  var gotResult = false;
  var runStart = 0;
  var lastFinal = { text: '', t: 0 };
  var seen = {};
  var logLines = [];
  var finals = [];

  var stats = {
    starts: 0, restarts: 0, finals: 0, chars: 0, dups: 0,
    liveMs: 0, sessions: 0, maxSessionMs: 0,
    gapSum: 0, gapN: 0, gapMax: 0,
    lastEnd: 0, lastResultAt: 0, errors: {}
  };

  // ---------- DOM ----------
  function $(id) { return document.getElementById(id); }
  var elStatus = $('statusBox'), elStateText = $('stateText'), elStateSub = $('stateSub');
  var btnStart = $('btnStart'), btnStop = $('btnStop');
  var optAuto = $('optAuto'), optInterim = $('optInterim'), optVerbose = $('optVerbose');
  var elInterim = $('interim'), elFinals = $('finals'), elLog = $('log');
  var elEnv = $('env'), elMetrics = $('metrics'), elCopyMsg = $('copyMsg');

  // ---------- ユーティリティ ----------
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function clock(t) { var d = new Date(t); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); }
  function dur(ms) {
    if (!isFinite(ms) || ms < 0) ms = 0;
    var s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
    s = s % 60;
    return h > 0 ? h + ':' + pad(m) + ':' + pad(s) : m + ':' + pad(s);
  }
  function sec1(ms) { return (ms / 1000).toFixed(1) + '秒'; }

  function setState(state, text, sub) {
    elStatus.setAttribute('data-state', state);
    elStateText.textContent = text;
    elStateSub.textContent = sub || '';
  }

  function addLog(kind, msg) {
    var t = Date.now();
    logLines.push(clock(t) + '\t' + kind + '\t' + msg);
    if (logLines.length > LOG_MAX) logLines.shift();
    var li = document.createElement('li');
    li.className = 'k-' + (kind === 'エラー' ? 'err' : kind === '状態' ? 'state' : kind === '詳細' ? 'ev' : 'x');
    var a = document.createElement('span'); a.className = 't'; a.textContent = clock(t);
    var b = document.createElement('span'); b.textContent = kind;
    var c = document.createElement('span'); c.textContent = msg;
    li.appendChild(a); li.appendChild(b); li.appendChild(c);
    elLog.insertBefore(li, elLog.firstChild);
    while (elLog.children.length > LOG_MAX) elLog.removeChild(elLog.lastChild);
  }

  function addFinal(text, dup) {
    var empty = elFinals.querySelector('.empty');
    if (empty) elFinals.removeChild(empty);
    var li = document.createElement('li');
    var a = document.createElement('span'); a.className = 't'; a.textContent = clock(Date.now());
    var b = document.createElement('span'); b.textContent = text;
    if (dup) { var g = document.createElement('span'); g.className = 'tag'; g.textContent = '重複疑い'; b.appendChild(g); }
    li.appendChild(a); li.appendChild(b);
    elFinals.insertBefore(li, elFinals.firstChild);
    while (elFinals.children.length > 200) elFinals.removeChild(elFinals.lastChild);
    finals.push(clock(Date.now()) + '\t' + (dup ? '[重複疑い] ' : '') + text);
    if (finals.length > 500) finals.shift();
  }

  // ---------- 実行環境の表示 ----------
  var envMic = '確認中';
  function renderEnv() {
    var ua = navigator.userAgent || '';
    var m = /Chrome\/([\d.]+)/.exec(ua);
    var rows = [
      ['アドレスの種類', location.protocol + '//' + (location.host || '')],
      ['安全なコンテキスト', window.isSecureContext ? 'はい' : 'いいえ'],
      ['音声認識API', SR ? '利用できます' : '利用できません'],
      ['マイク許可の状態', envMic],
      ['Chrome', m ? m[1] : '不明'],
      ['画面の状態', document.visibilityState],
      ['ネットワーク', navigator.onLine ? 'オンライン' : 'オフライン']
    ];
    elEnv.textContent = '';
    rows.forEach(function (r) {
      var dt = document.createElement('dt'); dt.textContent = r[0];
      var dd = document.createElement('dd'); dd.textContent = r[1];
      elEnv.appendChild(dt); elEnv.appendChild(dd);
    });
    if (location.protocol === 'file:') {
      var dt2 = document.createElement('dt'); dt2.textContent = '注意';
      var dd2 = document.createElement('dd'); dd2.className = 'warn';
      dd2.textContent = 'file:// で開いています。マイク許可が保存されず、再開のたびに許可の確認が出る場合があります。';
      elEnv.appendChild(dt2); elEnv.appendChild(dd2);
    }
  }

  function watchMicPermission() {
    try {
      if (!navigator.permissions || !navigator.permissions.query) { envMic = '取得不可'; renderEnv(); return; }
      navigator.permissions.query({ name: 'microphone' }).then(function (p) {
        function upd() {
          envMic = p.state === 'granted' ? '許可済み' : p.state === 'denied' ? '拒否' : '未確認(都度確認)';
          renderEnv();
        }
        upd();
        p.onchange = function () { upd(); addLog('環境', 'マイク許可が変わりました: ' + envMic); };
      }, function () { envMic = '取得不可'; renderEnv(); });
    } catch (e) { envMic = '取得不可'; renderEnv(); }
  }

  // ---------- 計測の表示 ----------
  function metric(k, v, small) {
    var d = document.createElement('div'); d.className = 'metric';
    var a = document.createElement('div'); a.className = 'k'; a.textContent = k;
    var b = document.createElement('div'); b.className = 'v' + (small ? ' small' : ''); b.textContent = v;
    d.appendChild(a); d.appendChild(b);
    return d;
  }
  function errSummary() {
    var parts = [];
    for (var k in stats.errors) if (Object.prototype.hasOwnProperty.call(stats.errors, k)) parts.push(k + '×' + stats.errors[k]);
    return parts.length ? parts.join(' / ') : 'なし';
  }
  function liveNow() { return stats.liveMs + (curStart ? Date.now() - curStart : 0); }
  function summaryLines() {
    var now = Date.now();
    var elapsed = runStart ? now - runStart : 0;
    var live = liveNow();
    return {
      elapsed: elapsed,
      rate: elapsed > 0 ? Math.min(100, Math.round(live / elapsed * 100)) : 0,
      avgSession: stats.sessions ? stats.liveMs / stats.sessions : 0,
      avgGap: stats.gapN ? stats.gapSum / stats.gapN : 0,
      sinceResult: stats.lastResultAt ? now - stats.lastResultAt : 0
    };
  }
  function renderMetrics() {
    var s = summaryLines();
    elMetrics.textContent = '';
    elMetrics.appendChild(metric('経過時間', dur(s.elapsed)));
    elMetrics.appendChild(metric('聞き取り中だった割合', s.rate + '%'));
    elMetrics.appendChild(metric('開始回数(再開含む)', String(stats.starts)));
    elMetrics.appendChild(metric('1回あたりの平均継続', dur(s.avgSession)));
    elMetrics.appendChild(metric('最長の継続', dur(stats.maxSessionMs)));
    elMetrics.appendChild(metric('終了から再開までの平均', stats.gapN ? sec1(s.avgGap) : '-'));
    elMetrics.appendChild(metric('終了から再開までの最長', stats.gapN ? sec1(stats.gapMax) : '-'));
    elMetrics.appendChild(metric('確定した発話', stats.finals + '件'));
    elMetrics.appendChild(metric('確定した文字数', String(stats.chars)));
    elMetrics.appendChild(metric('重複疑い', stats.dups + '件'));
    elMetrics.appendChild(metric('最後の認識から', stats.lastResultAt ? dur(s.sinceResult) : '-'));
    elMetrics.appendChild(metric('エラー内訳', errSummary(), true));
  }

  // ---------- 音声認識 ----------
  function createRec() {
    var r = new SR();
    r.lang = LANG;
    r.continuous = true;
    r.interimResults = optInterim.checked;
    r.maxAlternatives = 1;

    r.onstart = function () {
      sessionNo++;
      stats.starts++;
      curStart = Date.now();
      gotResult = false;
      if (stats.lastEnd) {
        var gap = curStart - stats.lastEnd;
        stats.gapSum += gap; stats.gapN++;
        if (gap > stats.gapMax) stats.gapMax = gap;
      }
      setState('listening', '聞き取り中', 'セッション ' + sessionNo + ' が動いています');
      addLog('状態', '開始 (セッション' + sessionNo + ')');
    };

    r.onresult = function (e) {
      var interim = '';
      addLog('詳細', 'result resultIndex=' + e.resultIndex + ' 件数=' + e.results.length);
      for (var i = e.resultIndex; i < e.results.length; i++) {
        var res = e.results[i];
        var text = (res[0] && res[0].transcript ? res[0].transcript : '').trim();
        if (res.isFinal) {
          if (!text) continue;
          var key = sessionNo + ':' + i;
          var now = Date.now();
          var dup = false;
          if (seen[key]) dup = true;
          else if (text === lastFinal.text && now - lastFinal.t < DUP_WINDOW_MS) dup = true;
          seen[key] = true;
          lastFinal = { text: text, t: now };
          gotResult = true;
          stats.lastResultAt = now;
          if (dup) { stats.dups++; addLog('エラー', '重複疑い: ' + text); }
          else { stats.finals++; stats.chars += text.length; }
          addFinal(text, dup);
          elInterim.textContent = '';
        } else {
          interim += text;
        }
      }
      if (interim) elInterim.textContent = '認識中: ' + interim;
    };

    r.onerror = function (e) {
      var code = e.error || 'unknown';
      if (code === 'aborted' && !wantRun) return;
      stats.errors[code] = (stats.errors[code] || 0) + 1;
      addLog(code === 'no-speech' ? '詳細' : 'エラー', 'error: ' + code + (e.message ? ' (' + e.message + ')' : ''));
      if (code === 'not-allowed' || code === 'service-not-allowed' || code === 'language-not-supported') {
        fatal = true;
        wantRun = false;
        setState('error', 'マイクを使えません', 'エラー: ' + code + '。許可設定を確認してから「開始」を押してください');
      }
    };

    r.onend = function () {
      var now = Date.now();
      var d = curStart ? now - curStart : 0;
      if (curStart) {
        stats.liveMs += d; stats.sessions++;
        if (d > stats.maxSessionMs) stats.maxSessionMs = d;
      }
      curStart = 0;
      stats.lastEnd = now;
      elInterim.textContent = '';
      addLog('状態', '終了 (継続 ' + sec1(d) + ')');

      if (fatal || !wantRun) {
        if (!fatal) setState('idle', '停止中', '停止しました');
        updateButtons();
        return;
      }
      if (!optAuto.checked) {
        wantRun = false;
        setState('idle', '停止中', '自動再開がオフのため停止しました');
        updateButtons();
        return;
      }
      if (gotResult || d >= HEALTHY_MS) backoff = BACKOFF_MIN;
      else backoff = Math.min(backoff * 2, BACKOFF_MAX);
      stats.restarts++;
      setState('waiting', '再開待ち', sec1(backoff) + '後に再開します');
      restartTimer = setTimeout(launch, backoff);
    };

    ['audiostart', 'soundstart', 'speechstart', 'speechend', 'soundend', 'audioend', 'nomatch'].forEach(function (n) {
      r.addEventListener(n, function () { if (optVerbose.checked) addLog('詳細', n); });
    });
    return r;
  }

  function launch() {
    restartTimer = null;
    if (!wantRun) return;
    try {
      rec = createRec();
      rec.start();
    } catch (e) {
      stats.errors['start-exception'] = (stats.errors['start-exception'] || 0) + 1;
      addLog('エラー', 'start() 例外: ' + e);
      backoff = Math.min(backoff * 2, BACKOFF_MAX);
      setState('waiting', '再開待ち', sec1(backoff) + '後に再試行します');
      restartTimer = setTimeout(launch, backoff);
    }
  }

  function updateButtons() {
    btnStart.disabled = wantRun;
    btnStop.disabled = !wantRun && !restartTimer;
  }

  function startRun() {
    if (!SR) {
      setState('error', '音声認識を使えません', 'このブラウザには音声認識APIがありません');
      addLog('エラー', 'SpeechRecognition 未対応');
      return;
    }
    wantRun = true; fatal = false; backoff = BACKOFF_MIN;
    if (!runStart) runStart = Date.now();
    setState('waiting', '起動中', 'マイクの許可を求められたら「許可」を選んでください');
    addLog('状態', '開始ボタン');
    updateButtons();
    launch();
  }

  function stopRun() {
    wantRun = false;
    if (restartTimer) { clearTimeout(restartTimer); restartTimer = null; }
    addLog('状態', '停止ボタン');
    if (rec) { try { rec.abort(); } catch (e) {} }
    if (!curStart) setState('idle', '停止中', '停止しました');
    updateButtons();
  }

  // ---------- コピー ----------
  function buildReport() {
    var s = summaryLines();
    var head = [
      '【音声書き起こし 動作確認の結果】',
      '取得: ' + new Date().toLocaleString(),
      'アドレス: ' + location.protocol + '//' + location.host + ' / 安全なコンテキスト: ' + (window.isSecureContext ? 'はい' : 'いいえ'),
      'Chrome: ' + ((/Chrome\/([\d.]+)/.exec(navigator.userAgent) || [])[1] || '不明') + ' / マイク許可: ' + envMic,
      '経過 ' + dur(s.elapsed) + ' / 聞き取り中の割合 ' + s.rate + '% / 開始回数 ' + stats.starts +
        ' / 平均継続 ' + dur(s.avgSession) + ' / 最長継続 ' + dur(stats.maxSessionMs),
      '再開までの空白: 平均 ' + (stats.gapN ? sec1(s.avgGap) : '-') + ' / 最長 ' + (stats.gapN ? sec1(stats.gapMax) : '-'),
      '確定 ' + stats.finals + '件 / 文字数 ' + stats.chars + ' / 重複疑い ' + stats.dups + '件',
      'エラー: ' + errSummary(),
      '',
      '--- 確定した発話 ---'
    ].concat(finals, ['', '--- イベント記録(古い順) ---'], logLines);
    return head.join('\n');
  }
  function copyReport() {
    var text = buildReport();
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      elCopyMsg.textContent = ok ? 'コピーしました' : 'コピーできませんでした';
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { elCopyMsg.textContent = 'コピーしました'; }, fallback);
    } else fallback();
    setTimeout(function () { elCopyMsg.textContent = ''; }, 4000);
  }

  function clearAll() {
    logLines = []; finals = []; seen = {};
    elLog.textContent = '';
    elFinals.textContent = '';
    var li = document.createElement('li'); li.className = 'empty'; li.style.display = 'block'; li.textContent = 'まだありません';
    elFinals.appendChild(li);
    stats = {
      starts: 0, restarts: 0, finals: 0, chars: 0, dups: 0,
      liveMs: 0, sessions: 0, maxSessionMs: 0,
      gapSum: 0, gapN: 0, gapMax: 0,
      lastEnd: 0, lastResultAt: 0, errors: {}
    };
    runStart = wantRun ? Date.now() : 0;
    if (curStart) curStart = Date.now();
    renderMetrics();
  }

  // ---------- イベント登録 ----------
  btnStart.addEventListener('click', startRun);
  btnStop.addEventListener('click', stopRun);
  $('btnCopy').addEventListener('click', copyReport);
  $('btnClear').addEventListener('click', clearAll);
  document.addEventListener('visibilitychange', function () {
    addLog('環境', '画面の状態: ' + document.visibilityState);
    renderEnv();
  });
  window.addEventListener('online', function () { addLog('環境', 'オンラインになりました'); renderEnv(); });
  window.addEventListener('offline', function () { addLog('環境', 'オフラインになりました'); renderEnv(); });

  // ---------- 初期表示 ----------
  renderEnv();
  watchMicPermission();
  renderMetrics();
  setInterval(renderMetrics, 1000);
  if (!SR) {
    setState('error', '音声認識を使えません', 'このブラウザには音声認識APIがありません');
  }
})();
</script>
</body>
</html>
